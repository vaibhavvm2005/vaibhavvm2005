<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaibhav Madival // Developer Portfolio & Profile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#000000',
              dark: '#030712',
              card: '#050B14',
              border: '#162338',
              cyan: '#00F0FF',
              cyanHover: '#38BDF8',
              blue: '#0284C7',
              violet: '#9C73F8'
            }
          },
          animation: {
            'spin-slow': 'spin 30s linear infinite',
            'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          fontFamily: {
            serif: ['"Times New Roman"', 'Times', 'Georgia', 'serif'],
            mono: ['"SFMono-Regular"', 'Consolas', '"Liberation Mono"', 'Menlo', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', '"Segoe UI"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      background-color: #000000;
      overflow-x: hidden;
    }
    .markdown-body {
      background-color: transparent !important;
      color: #E2E8F0 !important;
    }
    .markdown-body table {
      width: 100%;
      background-color: #030712 !important;
      border: 1px solid #162338 !important;
      border-radius: 8px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #162338 !important;
      padding: 16px !important;
    }
    .markdown-body tr {
      background-color: #030712 !important;
    }
    .markdown-body code {
      background-color: rgba(0, 240, 255, 0.08) !important;
      color: #00F0FF !important;
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .markdown-body pre {
      background-color: #030712 !important;
      border: 1px solid #162338 !important;
    }
    .markdown-body a {
      color: #00F0FF !important;
    }
  </style>
</head>
<body class="bg-black text-slate-200 min-h-screen py-10 px-4 flex justify-center font-sans antialiased relative selection:bg-cyan-500/30 selection:text-cyan-300">

  <!-- ==================== FIXED AI TECH WEB BACKGROUND ==================== -->
  <div class="fixed top-10 -left-36 w-[480px] h-[480px] opacity-20 pointer-events-none filter blur-[1px] z-0">
    <img src="assets/tech-web-circle.svg" alt="AI Background Web" class="w-full h-full animate-spin-slow" />
  </div>

  <div class="fixed bottom-10 -right-36 w-[520px] h-[520px] opacity-15 pointer-events-none filter blur-[1px] z-0">
    <img src="assets/tech-web-circle.svg" alt="AI Background Web" class="w-full h-full animate-spin-slow" style="animation-direction: reverse;" />
  </div>

  <!-- Ambient Light Orbs -->
  <div class="fixed top-1/3 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-cyan-500/10 rounded-full blur-[140px] pointer-events-none z-0"></div>

  <!-- ==================== MAIN PORTFOLIO CARD CONTAINER ==================== -->
  <div class="max-w-5xl w-full bg-cyber-card/90 border border-cyber-border rounded-2xl p-6 md:p-10 shadow-2xl shadow-cyan-950/30 backdrop-blur-2xl relative z-10">
    
    <!-- Top System Telemetry Bar (Tailwind Styled) -->
    <div class="flex flex-wrap justify-between items-center pb-5 mb-8 border-b border-cyber-border font-mono text-xs text-cyber-cyan">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-cyber-cyan animate-ping"></span>
        <span class="font-bold tracking-wider">● LIVE PROFILE // AI NEURAL WEB BACKGROUND ENGINE</span>
      </div>
      <div class="flex items-center space-x-4 text-slate-400 mt-2 sm:mt-0">
        <span>VTU CSE (DATA SCIENCE)</span>
        <span class="text-cyber-cyan">@vaibhavvm2005</span>
      </div>
    </div>

    <!-- Main Markdown / HTML Content Container -->
    <div id="content" class="markdown-body">
      <div class="flex items-center justify-center py-20 text-cyber-cyan font-mono animate-pulse">
        Initializing profile render with AI background...
      </div>
    </div>

  </div>

  <script>
    fetch('README.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').innerText = 'Error loading README.md: ' + err;
      });
  </script>
</body>
</html>
