<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="12" fill="#080808" stroke="#1F1F1F" stroke-width="1"/>

  <!-- Figma Selection Comment Bubble -->
  <g transform="translate(60, 40)">
    <!-- Comment Box -->
    <rect width="520" height="130" rx="16" fill="url(#bubbleBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <!-- User Chip & Timestamp -->
    <text x="24" y="36" fill="rgba(255, 255, 255, 0.65)" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Vaibhav</text>
    <text x="85" y="36" fill="rgba(255, 255, 255, 0.3)" font-family="'Inter', sans-serif" font-size="13" font-weight="400">4 years ago</text>

    <!-- Main Quote -->
    <text x="24" y="74" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3">
      I started with programming &amp; software logic,
    </text>
    <text x="24" y="104" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="-0.3">
      focusing on algorithms and clean data structures.
    </text>
  </g>

  <!-- Figma Cursor Pointing to Bubble -->
  <g transform="translate(560, 160)">
    <path d="M 0 0 L 6 22 L 11 16 L 18 16 Z" fill="#0FD6D9" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="15" y="12" width="76" height="22" rx="11" fill="#0FD6D9"/>
    <text x="53" y="27" fill="#000000" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Vaibhav</text>
  </g>

  <!-- Right Decorative Creative Vector Lines -->
  <g transform="translate(670, 30)" opacity="0.6">
    <polygon points="40,20 120,50 100,120 20,90" fill="none" stroke="#0FD6D9" stroke-width="2"/>
    <line x1="40" y1="20" x2="100" y2="120" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="40" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="120" cy="50" r="3" fill="#0FD6D9"/>
    <circle cx="100" cy="120" r="3" fill="#FFFFFF"/>
    <circle cx="20" cy="90" r="3" fill="#0FD6D9"/>
  </g>
</svg>
