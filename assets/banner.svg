<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Deep Matte-Black Canvas Gradient -->
    <linearGradient id="matteBlackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#020307" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Headline Typography Gradient -->
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Electric Cyan Subtitle Gradient -->
    <linearGradient id="cyanSubtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Bottom Laser Beam -->
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Cyan Lighting -->
    <radialGradient id="centerAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#0051FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightClusterGlow" cx="88%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftClusterGlow" cx="12%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#0051FF" stop-opacity="0.09" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Digital Grid Pattern -->
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="0.75" fill="#00F0FF" fill-opacity="0.12" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="subtleTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="particleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Slow Atmospheric Motion Engine */
      @keyframes synapPulse {
        0%, 100% { opacity: 0.15; stroke-width: 0.8; }
        50% { opacity: 0.45; stroke-width: 1.2; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3; opacity: 0.4; }
        50% { r: 5; opacity: 0.9; }
      }
      @keyframes dataStreamTravel {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes laserScanMove {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes particleDrift {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(-6px); opacity: 0.6; }
      }

      .synapse-link {
        animation: synapPulse 5s ease-in-out infinite;
      }
      .node-core {
        animation: nodePulse 3.8s ease-in-out infinite;
      }
      .stream-flow-1 {
        stroke-dasharray: 8 120;
        animation: dataStreamTravel 6s linear infinite;
      }
      .stream-flow-2 {
        stroke-dasharray: 6 90;
        animation: dataStreamTravel 7.5s linear infinite;
      }
      .laser-scan-beam {
        animation: laserScanMove 4.5s ease-in-out infinite;
      }
      .drifting-particle {
        animation: particleDrift 4s ease-in-out infinite;
      }

      .sans-headline {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono-math {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
    </style>
  </defs>

  <!-- ==================== DEEP MATTE-BLACK BASE & AMBIENT GLOWS ==================== -->
  <rect width="1200" height="360" rx="14" fill="url(#matteBlackBg)" stroke="#161B26" stroke-width="1.2" />
  <rect width="1200" height="360" rx="14" fill="url(#fineGrid)" />
  <rect width="1200" height="360" rx="14" fill="url(#centerAmbient)" />
  <rect width="1200" height="360" rx="14" fill="url(#rightClusterGlow)" />
  <rect width="1200" height="360" rx="14" fill="url(#leftClusterGlow)" />

  <!-- ==================== MATHEMATICAL & STATISTICAL CURVES (Background Depth) ==================== -->
  <!-- Gaussian Normal Distribution Curve (Subtle) -->
  <path d="M 50 280 C 150 280, 200 280, 260 210 C 300 160, 330 160, 360 220 C 400 280, 450 280, 520 280" 
        fill="none" stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Optimization Loss Descent Trajectory (Right Background) -->
  <path d="M 680 80 Q 780 120, 880 200 T 1150 280" 
        fill="none" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1.2" />

  <!-- Faint Matrix / Code / Mathematical Formula Notations in Background -->
  <g fill="#00F0FF" font-size="9" font-weight="500" opacity="0.06" class="mono-math">
    <text x="80" y="70">∇_θ L(θ) = E[ ∇_θ log p_θ(x) ]</text>
    <text x="75" y="110">f(x) = σ(W^T · x + b)</text>
    <text x="90" y="310">dim: [batch_size, hidden_dim, seq_len]</text>
    <text x="960" y="70">ROC-AUC: 0.942 // loss: 0.018</text>
    <text x="980" y="110">p(y|x) = softmax(z_i)</text>
    <text x="970" y="310">optimizer: AdamW(lr=1e-4)</text>
  </g>

  <!-- Technical Coordinate Markers (+) -->
  <g stroke="#00F0FF" stroke-opacity="0.1" stroke-width="0.8">
    <path d="M 40 40 L 48 40 M 44 36 L 44 44" />
    <path d="M 1160 40 L 1168 40 M 1164 36 L 1164 44" />
    <path d="M 40 320 L 48 320 M 44 316 L 44 324" />
    <path d="M 1160 320 L 1168 320 M 1164 316 L 1164 324" />
  </g>

  <!-- ==================== LEFT FLANK: DATA PIPELINES & ABSTRACT COMPUTATIONAL NODES ==================== -->
  <g fill="none">
    <!-- Synaptic Filament Pathways -->
    <line x1="80" y1="180" x2="160" y2="130" stroke="#00F0FF" class="synapse-link" />
    <line x1="160" y1="130" x2="250" y2="160" stroke="#00F0FF" class="synapse-link" />
    <line x1="160" y1="130" x2="190" y2="230" stroke="#38BDF8" class="synapse-link" />
    <line x1="80" y1="180" x2="120" y2="250" stroke="#00F0FF" class="synapse-link" />
    <line x1="120" y1="250" x2="190" y2="230" stroke="#00F0FF" class="synapse-link" />
    <line x1="190" y1="230" x2="280" y2="240" stroke="#00F0FF" class="synapse-link" />
    <line x1="250" y1="160" x2="280" y2="240" stroke="#38BDF8" class="synapse-link" />

    <!-- Animated Data Flow on Left Flank -->
    <path d="M 80 180 L 160 130 L 250 160 L 280 240" 
          stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" class="stream-flow-2" filter="url(#particleGlow)" />

    <!-- Left Junction Nodes -->
    <g fill="#000000" stroke="#00F0FF" stroke-width="1.4">
      <circle cx="80" cy="180" r="3.5" />
      <circle cx="160" cy="130" r="4.5" stroke="#FFFFFF" />
      <circle cx="250" cy="160" r="4" />
      <circle cx="120" cy="250" r="3.5" />
      <circle cx="190" cy="230" r="5" stroke="#FFFFFF" />
      <circle cx="280" cy="240" r="4" />
    </g>

    <!-- Node Glow Pulses -->
    <circle cx="160" cy="130" r="3.5" fill="#00F0FF" class="node-core" filter="url(#particleGlow)" />
    <circle cx="190" cy="230" r="4" fill="#38BDF8" class="node-core" filter="url(#particleGlow)" />

    <!-- Node Inner Sparks -->
    <circle cx="160" cy="130" r="1.5" fill="#FFFFFF" />
    <circle cx="190" cy="230" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- ==================== RIGHT FLANK: NEURAL NETWORK TOPOLOGY & DATA STREAMS ==================== -->
  <g fill="none">
    <!-- Synaptic Filament Pathways -->
    <line x1="920" y1="120" x2="1010" y2="85" stroke="#00F0FF" class="synapse-link" />
    <line x1="1010" y1="85" x2="1110" y2="110" stroke="#00F0FF" class="synapse-link" />
    <line x1="1010" y1="85" x2="1040" y2="175" stroke="#38BDF8" class="synapse-link" />
    <line x1="920" y1="120" x2="960" y2="210" stroke="#00F0FF" class="synapse-link" />
    <line x1="960" y1="210" x2="1040" y2="175" stroke="#00F0FF" class="synapse-link" />
    <line x1="1040" y1="175" x2="1130" y2="190" stroke="#00F0FF" class="synapse-link" />
    <line x1="1110" y1="110" x2="1130" y2="190" stroke="#38BDF8" class="synapse-link" />
    <line x1="1040" y1="175" x2="1070" y2="260" stroke="#00F0FF" class="synapse-link" />
    <line x1="960" y1="210" x2="1010" y2="275" stroke="#38BDF8" class="synapse-link" />
    <line x1="1010" y1="275" x2="1070" y2="260" stroke="#00F0FF" class="synapse-link" />
    <line x1="1070" y1="260" x2="1150" y2="270" stroke="#00F0FF" class="synapse-link" />
    <line x1="1130" y1="190" x2="1150" y2="270" stroke="#38BDF8" class="synapse-link" />

    <!-- Animated High-Speed Inference Stream -->
    <path d="M 920 120 L 1010 85 L 1110 110 L 1130 190 L 1070 260 L 1150 270" 
          stroke="#00F0FF" stroke-width="2" stroke-linecap="round" class="stream-flow-1" filter="url(#particleGlow)" />
    
    <path d="M 960 210 L 1040 175 L 1110 110" 
          stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" class="stream-flow-2" />

    <!-- Right Junction Nodes -->
    <g fill="#000000" stroke="#00F0FF" stroke-width="1.4">
      <circle cx="920" cy="120" r="4" />
      <circle cx="1010" cy="85" r="5" stroke="#FFFFFF" />
      <circle cx="1110" cy="110" r="4" />
      <circle cx="960" cy="210" r="4" />
      <circle cx="1040" cy="175" r="5.5" stroke="#FFFFFF" />
      <circle cx="1130" cy="190" r="4.5" />
      <circle cx="1010" cy="275" r="4" />
      <circle cx="1070" cy="260" r="5" stroke="#FFFFFF" />
      <circle cx="1150" cy="270" r="4" />
    </g>

    <!-- Node Glow Pulses -->
    <circle cx="1010" cy="85" r="4" fill="#00F0FF" class="node-core" filter="url(#particleGlow)" />
    <circle cx="1040" cy="175" r="4.5" fill="#00F0FF" class="node-core" filter="url(#particleGlow)" />
    <circle cx="1070" cy="260" r="4" fill="#38BDF8" class="node-core" filter="url(#particleGlow)" />

    <!-- Node Inner Sparks -->
    <circle cx="1010" cy="85" r="1.8" fill="#FFFFFF" />
    <circle cx="1040" cy="175" r="2.2" fill="#FFFFFF" />
    <circle cx="1070" cy="260" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- ==================== FLOATING DIGITAL DATA PARTICLES ==================== -->
  <g fill="#00F0FF" class="drifting-particle">
    <circle cx="220" cy="90" r="1.2" opacity="0.6" />
    <circle cx="340" cy="70" r="1.5" opacity="0.4" />
    <circle cx="860" cy="80" r="1.5" opacity="0.5" />
    <circle cx="980" cy="310" r="1.2" opacity="0.4" />
    <circle cx="310" cy="290" r="1.4" opacity="0.5" />
  </g>

  <!-- ==================== CENTRAL UNCLUTTERED TYPOGRAPHY AREA ==================== -->
  <!-- Subtle Framing Reticle Lines Above Title -->
  <g stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" fill="none">
    <line x1="450" y1="85" x2="520" y2="85" />
    <line x1="680" y1="85" x2="750" y2="85" />
    <circle cx="600" cy="85" r="2" fill="#00F0FF" />
  </g>

  <!-- DOMINANT MAIN HEADLINE -->
  <text x="600" y="180" 
        text-anchor="middle" 
        fill="url(#headlineGrad)" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="6" 
        class="sans-headline" 
        filter="url(#subtleTextGlow)">
    VAIBHAV MADIVAL
  </text>

  <!-- ELEGANT SUBTITLE -->
  <text x="600" y="228" 
        text-anchor="middle" 
        fill="url(#cyanSubtitleGrad)" 
        font-size="16.5" 
        font-weight="700" 
        letter-spacing="5.5" 
        class="sans-headline">
    DATA SCIENTIST • MACHINE LEARNING ENGINEER
  </text>

  <!-- ==================== BOTTOM SCANNING LASER BEAM ==================== -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="#161B26" stroke-width="1.2" />
  <rect x="0" y="357" width="340" height="2" fill="url(#laserBeamGrad)" class="laser-scan-beam" />
</svg>
