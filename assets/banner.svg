<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Deep Matte-Black Canvas -->
    <linearGradient id="deepBlack3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#020408" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- 3D Monolith Card Gradient -->
    <linearGradient id="monolithCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#03060B" stop-opacity="0.98" />
    </linearGradient>

    <!-- 3D Cube Face Gradients -->
    <linearGradient id="cubeTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0080FF" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="cubeLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1C33" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>
    <linearGradient id="cubeRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#061021" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="text3DGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cyanSubtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#003B99" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Realistic 3D Deep Shadow Filter -->
    <filter id="deepShadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#00F0FF" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="softGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleTextShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      @keyframes float3D_A {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes float3D_B {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-1.5deg); }
      }
      @keyframes shadowBreathe {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(0.85); opacity: 0.15; }
      }
      @keyframes dataPulseTravel {
        0% { stroke-dashoffset: 280; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes laserScanSweep {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes node3DPulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 1; }
      }

      .floating-3d-left {
        animation: float3D_A 6s ease-in-out infinite;
      }
      .floating-3d-right {
        animation: float3D_B 5s ease-in-out infinite;
      }
      .shadow-breathe-anim {
        transform-origin: center;
        animation: shadowBreathe 6s ease-in-out infinite;
      }
      .pulse-stream-3d {
        stroke-dasharray: 8 90;
        animation: dataPulseTravel 5s linear infinite;
      }
      .laser-sweep-anim {
        animation: laserScanSweep 4.5s ease-in-out infinite;
      }
      .node-pulse-3d {
        transform-origin: center;
        animation: node3DPulse 3.5s ease-in-out infinite;
      }

      .sans-3d-title {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
      }
      .mono-telemetry {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
    </style>
  </defs>

  <!-- ==================== BASE CANVAS & AMBIENT 3D ATMOSPHERE ==================== -->
  <rect width="1200" height="380" rx="16" fill="url(#deepBlack3D)" stroke="#161F2E" stroke-width="1.2" />
  <rect width="1200" height="380" rx="16" fill="url(#centerGlow)" />

  <!-- ==================== ISOMETRIC 3D GRID FLOOR (Perspective Depth) ==================== -->
  <g stroke="#00F0FF" stroke-opacity="0.04" stroke-width="0.8" fill="none">
    <path d="M 0 340 L 600 240 L 1200 340" />
    <path d="M 0 370 L 600 270 L 1200 370" />
    
    <line x1="600" y1="240" x2="100" y2="380" />
    <line x1="600" y1="240" x2="300" y2="380" />
    <line x1="600" y1="240" x2="500" y2="380" />
    <line x1="600" y1="240" x2="700" y2="380" />
    <line x1="600" y1="240" x2="900" y2="380" />
    <line x1="600" y1="240" x2="1100" y2="380" />
  </g>

  <!-- ==================== LEFT 3D FLOATING ISOMETRIC STRUCTURE ==================== -->
  <ellipse cx="140" cy="305" rx="55" ry="18" fill="#00F0FF" class="shadow-breathe-anim" filter="url(#softGlowFilter)" />
  <ellipse cx="140" cy="305" rx="60" ry="16" fill="#000000" opacity="0.8" />

  <g class="floating-3d-left">
    <!-- Isometric Cube 1 (Lower) -->
    <g transform="translate(140, 210)">
      <polygon points="0,-24 38,-4 0,16 -38,-4" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-38,-4 0,16 0,56 -38,36" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,16 38,-4 38,36 0,56" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-4" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Isometric Cube 2 (Upper Floating) -->
    <g transform="translate(100, 110)">
      <polygon points="0,-16 26,-3 0,10 -26,-3" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-26,-3 0,10 0,36 -26,23" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,10 26,-3 26,23 0,36" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-3" r="2" fill="#FFFFFF" />
    </g>

    <line x1="100" y1="130" x2="140" y2="190" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 100 130 L 140 190 L 250 200" stroke="#00F0FF" stroke-width="1.8" fill="none" class="pulse-stream-3d" filter="url(#softGlowFilter)" />

    <g transform="translate(250, 200)">
      <circle cx="0" cy="0" r="5" fill="#00F0FF" class="node-pulse-3d" filter="url(#softGlowFilter)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== RIGHT 3D FLOATING NEURAL CLUSTER ==================== -->
  <ellipse cx="1060" cy="305" rx="55" ry="18" fill="#00F0FF" class="shadow-breathe-anim" filter="url(#softGlowFilter)" />
  <ellipse cx="1060" cy="305" rx="60" ry="16" fill="#000000" opacity="0.8" />

  <g class="floating-3d-right">
    <!-- Isometric Cube (Right) -->
    <g transform="translate(1060, 200)">
      <polygon points="0,-26 42,-5 0,16 -42,-5" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-42,-5 0,16 0,58 -42,37" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,16 42,-5 42,37 0,58" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-5" r="3" fill="#FFFFFF" />
    </g>

    <!-- Upper Right Floating Node -->
    <g transform="translate(1100, 100)">
      <polygon points="0,-18 28,-3 0,12 -28,-3" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-28,-3 0,12 0,38 -28,23" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,12 28,-3 28,23 0,38" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-3" r="2.5" fill="#FFFFFF" />
    </g>

    <line x1="1100" y1="120" x2="1060" y2="180" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 960 170 L 1060 180 L 1100 120" stroke="#00F0FF" stroke-width="1.8" fill="none" class="pulse-stream-3d" filter="url(#softGlowFilter)" />

    <g transform="translate(960, 170)">
      <circle cx="0" cy="0" r="5" fill="#00F0FF" class="node-pulse-3d" filter="url(#softGlowFilter)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== CENTRAL 3D GLASS MONOLITH WITH DROP SHADOW ==================== -->
  <g transform="translate(240, 50)" filter="url(#deepShadow3D)">
    <rect x="0" y="0" width="720" height="250" rx="14" fill="url(#monolithCardGrad)" stroke="#1E293B" stroke-width="1.2" />

    <path d="M 14 0 L 706 0" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />
    
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 708 24 L 708 12 L 696 12" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 708 226 L 708 238 L 696 238" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />

    <g transform="translate(36, 32)">
      <circle cx="4" cy="4" r="3" fill="#00F0FF" class="node-pulse-3d" filter="url(#softGlowFilter)" />
      <text x="16" y="8" fill="#00F0FF" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-telemetry">
        SYSTEM.ONLINE // AI &amp; DATA PLATFORM
      </text>
      <text x="530" y="8" fill="#64748B" font-size="10" font-weight="600" letter-spacing="1" class="mono-telemetry">
        GITHUB: @vaibhavvm2005
      </text>
    </g>

    <!-- ==================== 3D EXTRUDED TYPOGRAPHY ==================== -->
    <g transform="translate(360, 120)">
      <text x="0" y="3" text-anchor="middle" fill="#020817" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d-title" opacity="0.9">
        VAIBHAV MADIVAL
      </text>
      <text x="0" y="1.5" text-anchor="middle" fill="#00F0FF" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d-title" opacity="0.35">
        VAIBHAV MADIVAL
      </text>
      <text x="0" y="0" text-anchor="middle" fill="url(#text3DGrad)" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d-title" filter="url(#subtleTextShadow)">
        VAIBHAV MADIVAL
      </text>
    </g>

    <g transform="translate(360, 162)">
      <text x="0" y="0" text-anchor="middle" fill="url(#cyanSubtitleGrad)" font-size="16.5" font-weight="700" letter-spacing="4.5" class="sans-3d-title">
        DATA SCIENTIST • MACHINE LEARNING ENGINEER
      </text>
    </g>

    <g transform="translate(85, 192)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="60" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Machine Learning</text>

      <rect x="132" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="192" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">MLOps &amp; Cloud</text>

      <rect x="264" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="324" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Speech AI &amp; NLP</text>

      <rect x="396" y="0" width="154" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="473" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Full Stack &amp; FastAPI</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SCANNING LASER BEAM ==================== -->
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#161F2E" stroke-width="1.2" />
  <rect x="0" y="377" width="340" height="2" fill="url(#laserLine)" class="laser-sweep-anim" />
</svg>