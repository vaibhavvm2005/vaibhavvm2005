<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Deep Matte-Black Base Canvas -->
    <linearGradient id="deepBlack3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#02050B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Monolith Glass Card Gradient -->
    <linearGradient id="monolithCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060D1A" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#02060E" stop-opacity="0.98" />
    </linearGradient>

    <!-- 3D Isometric Cube Gradients -->
    <linearGradient id="cubeTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="cubeLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2442" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
    <linearGradient id="cubeRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19375E" />
      <stop offset="100%" stop-color="#061226" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="text3DGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cyanSubtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Dynamic Moving Background Ambient Shadows -->
    <radialGradient id="movingShadow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#003B99" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="movingShadow2" cx="75%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pulsingCoreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.09" />
      <stop offset="60%" stop-color="#001838" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Multi-Layer Shadow Filters -->
    <filter id="monolithDeepShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#00F0FF" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="floorShadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <style>
      /* Background Volumetric Shadow Animations */
      @keyframes bgShadowDrift1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.7; }
        50% { transform: translate(120px, 40px) scale(1.15); opacity: 1; }
      }
      @keyframes bgShadowDrift2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.8; }
        50% { transform: translate(-100px, -30px) scale(1.2); opacity: 0.5; }
      }
      @keyframes coreGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.12); opacity: 1; }
      }

      /* 3D Object Floating & Dynamic Shadows */
      @keyframes floatLeft3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(2deg); }
      }
      @keyframes floatRight3D {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-2deg); }
      }
      @keyframes shadowBreatheLeft {
        0%, 100% { transform: scale(1) translateX(0px); opacity: 0.45; }
        50% { transform: scale(0.8) translateX(6px); opacity: 0.2; }
      }
      @keyframes shadowBreatheRight {
        0%, 100% { transform: scale(1) translateX(0px); opacity: 0.45; }
        50% { transform: scale(0.8) translateX(-6px); opacity: 0.2; }
      }
      @keyframes dataPulseFlow {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes laserScanSweep {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes cardShadowPulse {
        0%, 100% { filter: drop-shadow(0 20px 25px rgba(0, 240, 255, 0.05)) drop-shadow(0 10px 10px rgba(0, 0, 0, 0.9)); }
        50% { filter: drop-shadow(0 32px 40px rgba(0, 240, 255, 0.12)) drop-shadow(0 15px 15px rgba(0, 0, 0, 0.95)); }
      }

      .bg-shadow-1 {
        transform-origin: center;
        animation: bgShadowDrift1 9s ease-in-out infinite;
      }
      .bg-shadow-2 {
        transform-origin: center;
        animation: bgShadowDrift2 11s ease-in-out infinite;
      }
      .bg-core-glow {
        transform-origin: center;
        animation: coreGlowPulse 6s ease-in-out infinite;
      }
      .float-left-anim {
        animation: floatLeft3D 6s ease-in-out infinite;
      }
      .float-right-anim {
        animation: floatRight3D 5.5s ease-in-out infinite;
      }
      .shadow-left-anim {
        transform-origin: 140px 315px;
        animation: shadowBreatheLeft 6s ease-in-out infinite;
      }
      .shadow-right-anim {
        transform-origin: 1060px 315px;
        animation: shadowBreatheRight 5.5s ease-in-out infinite;
      }
      .pulse-stream {
        stroke-dasharray: 8 90;
        animation: dataPulseFlow 5s linear infinite;
      }
      .laser-anim {
        animation: laserScanSweep 4.5s ease-in-out infinite;
      }
      .card-shadow-anim {
        animation: cardShadowPulse 6s ease-in-out infinite;
      }

      .sans-3d {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Montserrat', 'Inter', 'Segoe UI', sans-serif;
      }
      .mono-telemetry {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
    </style>
  </defs>

  <!-- ==================== BASE CANVAS ==================== -->
  <rect width="1200" height="380" rx="16" fill="url(#deepBlack3D)" stroke="#161F2E" stroke-width="1.2" />

  <!-- ==================== WHOLE BACKGROUND SHADOW & VOLUMETRIC LIGHT ANIMATIONS ==================== -->
  <g>
    <!-- Drifting Ambient Shadow Orb 1 -->
    <rect x="-100" y="-80" width="1400" height="540" fill="url(#movingShadow1)" class="bg-shadow-1" />
    
    <!-- Drifting Ambient Shadow Orb 2 -->
    <rect x="-100" y="-80" width="1400" height="540" fill="url(#movingShadow2)" class="bg-shadow-2" />
    
    <!-- Core Ambient Pulsing Shadow Glow -->
    <rect width="1200" height="380" fill="url(#pulsingCoreGlow)" class="bg-core-glow" />
  </g>

  <!-- ==================== 3D ISOMETRIC PERSPECTIVE GRID FLOOR ==================== -->
  <g stroke="#00F0FF" stroke-opacity="0.05" stroke-width="0.9" fill="none">
    <path d="M 0 330 L 600 230 L 1200 330" />
    <path d="M 0 360 L 600 260 L 1200 360" />
    <path d="M 0 380 L 600 280 L 1200 380" />
    
    <line x1="600" y1="230" x2="80" y2="380" />
    <line x1="600" y1="230" x2="260" y2="380" />
    <line x1="600" y1="230" x2="440" y2="380" />
    <line x1="600" y1="230" x2="600" y2="380" />
    <line x1="600" y1="230" x2="760" y2="380" />
    <line x1="600" y1="230" x2="940" y2="380" />
    <line x1="600" y1="230" x2="1120" y2="380" />
  </g>

  <!-- ==================== LEFT 3D FLOATING STRUCTURE & ANIMATED SHADOW ==================== -->
  <g class="shadow-left-anim">
    <ellipse cx="140" cy="315" rx="70" ry="20" fill="#00F0FF" opacity="0.15" filter="url(#floorShadowBlur)" />
    <ellipse cx="140" cy="315" rx="55" ry="14" fill="#000000" opacity="0.85" filter="url(#floorShadowBlur)" />
  </g>

  <g class="float-left-anim">
    <g transform="translate(140, 215)">
      <polygon points="0,-26 40,-5 0,16 -40,-5" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-40,-5 0,16 0,58 -40,37" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,16 40,-5 40,37 0,58" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-5" r="2.5" fill="#FFFFFF" />
    </g>

    <g transform="translate(95, 110)">
      <polygon points="0,-18 28,-3 0,12 -28,-3" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-28,-3 0,12 0,38 -28,23" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,12 28,-3 28,23 0,38" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-3" r="2" fill="#FFFFFF" />
    </g>

    <line x1="95" y1="130" x2="140" y2="195" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 95 130 L 140 195 L 250 205" stroke="#00F0FF" stroke-width="1.8" fill="none" class="pulse-stream" filter="url(#softGlow)" />

    <g transform="translate(250, 205)">
      <circle cx="0" cy="0" r="5" fill="#00F0FF" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== RIGHT 3D FLOATING STRUCTURE & ANIMATED SHADOW ==================== -->
  <g class="shadow-right-anim">
    <ellipse cx="1060" cy="315" rx="70" ry="20" fill="#00F0FF" opacity="0.15" filter="url(#floorShadowBlur)" />
    <ellipse cx="1060" cy="315" rx="55" ry="14" fill="#000000" opacity="0.85" filter="url(#floorShadowBlur)" />
  </g>

  <g class="float-right-anim">
    <g transform="translate(1060, 205)">
      <polygon points="0,-28 44,-6 0,16 -44,-6" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-44,-6 0,16 0,60 -44,38" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,16 44,-6 44,38 0,60" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-6" r="3" fill="#FFFFFF" />
    </g>

    <g transform="translate(1105, 100)">
      <polygon points="0,-18 28,-3 0,12 -28,-3" fill="url(#cubeTopGrad)" stroke="#00F0FF" stroke-width="0.8" />
      <polygon points="-28,-3 0,12 0,38 -28,23" fill="url(#cubeLeftGrad)" stroke="#162740" stroke-width="0.8" />
      <polygon points="0,12 28,-3 28,23 0,38" fill="url(#cubeRightGrad)" stroke="#162740" stroke-width="0.8" />
      <circle cx="0" cy="-3" r="2.5" fill="#FFFFFF" />
    </g>

    <line x1="1105" y1="120" x2="1060" y2="185" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5" />
    <path d="M 960 175 L 1060 185 L 1105 120" stroke="#00F0FF" stroke-width="1.8" fill="none" class="pulse-stream" filter="url(#softGlow)" />

    <g transform="translate(960, 175)">
      <circle cx="0" cy="0" r="5" fill="#00F0FF" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== CENTRAL 3D GLASS MONOLITH WITH DYNAMIC SHADOW ANIMATION ==================== -->
  <g transform="translate(240, 50)" class="card-shadow-anim" filter="url(#monolithDeepShadow)">
    <rect x="0" y="0" width="720" height="250" rx="14" fill="url(#monolithCardGrad)" stroke="#1E293B" stroke-width="1.2" />

    <path d="M 14 0 L 706 0" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.5" />
    
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 708 24 L 708 12 L 696 12" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 12 226 L 12 238 L 24 238" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 708 226 L 708 238 L 696 238" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8" />

    <g transform="translate(36, 32)">
      <circle cx="4" cy="4" r="3" fill="#00F0FF" filter="url(#softGlow)" />
      <text x="16" y="8" fill="#00F0FF" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-telemetry">
        SYSTEM.ONLINE // 3D AMBIENT SHADOW ENGINE
      </text>
      <text x="530" y="8" fill="#64748B" font-size="10" font-weight="600" letter-spacing="1" class="mono-telemetry">
        GITHUB: @vaibhavvm2005
      </text>
    </g>

    <!-- ==================== 3D EXTRUDED SHADOW TYPOGRAPHY ==================== -->
    <g transform="translate(360, 120)">
      <text x="0" y="4" text-anchor="middle" fill="#01040A" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d" opacity="0.95">
        VAIBHAV MADIVAL
      </text>
      <text x="0" y="2" text-anchor="middle" fill="#00F0FF" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d" opacity="0.4">
        VAIBHAV MADIVAL
      </text>
      <text x="0" y="0" text-anchor="middle" fill="url(#text3DGrad)" font-size="54" font-weight="900" letter-spacing="5" class="sans-3d">
        VAIBHAV MADIVAL
      </text>
    </g>

    <g transform="translate(360, 162)">
      <text x="0" y="0" text-anchor="middle" fill="url(#cyanSubtitleGrad)" font-size="16.5" font-weight="700" letter-spacing="4.5" class="sans-3d">
        DATA SCIENTIST • MACHINE LEARNING ENGINEER
      </text>
    </g>

    <g transform="translate(85, 192)">
      <rect x="0" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="60" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Machine Learning</text>

      <rect x="132" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="192" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">MLOps &amp; Cloud</text>

      <rect x="264" y="0" width="120" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="324" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Speech AI &amp; NLP</text>

      <rect x="396" y="0" width="154" height="28" rx="6" fill="#040812" stroke="#16253B" stroke-width="1" />
      <text x="473" y="18" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Full Stack &amp; FastAPI</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SCANNING LASER BEAM ==================== -->
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#161F2E" stroke-width="1.2" />
  <rect x="0" y="377" width="340" height="2" fill="url(#laserBeamGrad)" class="laser-anim" />
</svg>