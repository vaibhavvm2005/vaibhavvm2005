<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 16" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="centerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <line x1="20" y1="8" x2="900" y2="8" stroke="url(#cyberLineGrad)" stroke-width="1" />
  <polygon points="460,4 464,8 460,12 456,8" fill="#00F0FF" filter="url(#centerGlow)" />
  <circle cx="460" cy="8" r="1.5" fill="#FFFFFF" />
</svg>
