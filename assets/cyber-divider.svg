<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="100%">
  <defs>
    <linearGradient id="dividerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="dividerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.4" />
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes diamondShadowPulse {
        0%, 100% { transform: scale(1) rotate(45deg); opacity: 0.7; }
        50% { transform: scale(1.3) rotate(45deg); opacity: 1; }
      }
      .diamond-anim {
        transform-origin: 600px 12px;
        animation: diamondShadowPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Line -->
  <line x1="100" y1="12" x2="1100" y2="12" stroke="url(#dividerLineGrad)" stroke-width="1.2" />

  <!-- Center Diamond with Shadow Filter -->
  <rect x="595" y="7" width="10" height="10" rx="1.5" fill="#00F0FF" stroke="#FFFFFF" stroke-width="1.2" class="diamond-anim" filter="url(#dividerShadow)" />
</svg>
