<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 145" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#0D1424" />
    </linearGradient>

    <linearGradient id="accentBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A162B" />
      <stop offset="100%" stop-color="#0F1F3D" />
    </linearGradient>

    <style>
      @keyframes arrowPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .flow-arrow {
        animation: arrowPulse 3s ease-in-out infinite;
      }
      .mono-txt {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
      .sans-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="920" height="145" rx="10" fill="#04070E" stroke="#1A2436" stroke-width="1.2" />

  <!-- Header Meta -->
  <g transform="translate(26, 24)">
    <circle cx="4" cy="4" r="3" fill="#00F0FF" />
    <text x="16" y="8" fill="#00F0FF" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-txt">
      SYSTEM ARCHITECTURE // PRODUCTION PIPELINE LIFECYCLE
    </text>
    <text x="705" y="8" fill="#64748B" font-size="10" font-weight="500" letter-spacing="0.5" class="mono-txt">
      LATENCY &lt; 25ms // ROC-AUC 0.942
    </text>
  </g>

  <!-- Connecting Chevrons -->
  <g stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.2" fill="none">
    <line x1="174" y1="80" x2="206" y2="80" />
    <polygon points="206,77 212,80 206,83" fill="#00F0FF" stroke="none" class="flow-arrow" />

    <line x1="354" y1="80" x2="386" y2="80" />
    <polygon points="386,77 392,80 386,83" fill="#00F0FF" stroke="none" class="flow-arrow" />

    <line x1="534" y1="80" x2="566" y2="80" />
    <polygon points="566,77 572,80 566,83" fill="#00F0FF" stroke="none" class="flow-arrow" />

    <line x1="714" y1="80" x2="746" y2="80" />
    <polygon points="746,77 752,80 746,83" fill="#00F0FF" stroke="none" class="flow-arrow" />
  </g>

  <!-- Stage 01 -->
  <g transform="translate(26, 48)">
    <rect width="148" height="64" rx="6" fill="url(#boxBg)" stroke="#1A2436" stroke-width="1" />
    <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="700" letter-spacing="1" class="mono-txt">STAGE 01</text>
    <text x="12" y="38" fill="#FFFFFF" font-size="12" font-weight="600" class="sans-txt">Data Ingestion</text>
    <text x="12" y="52" fill="#94A3B8" font-size="9.5" class="mono-txt">EDA &amp; Telemetry</text>
  </g>

  <!-- Stage 02 -->
  <g transform="translate(206, 48)">
    <rect width="148" height="64" rx="6" fill="url(#accentBoxBg)" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="12" y="18" fill="#00F0FF" font-size="8.5" font-weight="700" letter-spacing="1" class="mono-txt">STAGE 02</text>
    <text x="12" y="38" fill="#FFFFFF" font-size="12" font-weight="600" class="sans-txt">Feature Engine</text>
    <text x="12" y="52" fill="#38BDF8" font-size="9.5" class="mono-txt">XGBoost · Sklearn</text>
  </g>

  <!-- Stage 03 -->
  <g transform="translate(386, 48)">
    <rect width="148" height="64" rx="6" fill="url(#boxBg)" stroke="#1A2436" stroke-width="1" />
    <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="700" letter-spacing="1" class="mono-txt">STAGE 03</text>
    <text x="12" y="38" fill="#FFFFFF" font-size="12" font-weight="600" class="sans-txt">MLflow Registry</text>
    <text x="12" y="52" fill="#94A3B8" font-size="9.5" class="mono-txt">Artifact &amp; Metric</text>
  </g>

  <!-- Stage 04 -->
  <g transform="translate(566, 48)">
    <rect width="148" height="64" rx="6" fill="url(#accentBoxBg)" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="12" y="18" fill="#00F0FF" font-size="8.5" font-weight="700" letter-spacing="1" class="mono-txt">STAGE 04</text>
    <text x="12" y="38" fill="#FFFFFF" font-size="12" font-weight="600" class="sans-txt">FastAPI REST</text>
    <text x="12" y="52" fill="#38BDF8" font-size="9.5" class="mono-txt">Async Inference</text>
  </g>

  <!-- Stage 05 -->
  <g transform="translate(746, 48)">
    <rect width="148" height="64" rx="6" fill="url(#boxBg)" stroke="#1A2436" stroke-width="1" />
    <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="700" letter-spacing="1" class="mono-txt">STAGE 05</text>
    <text x="12" y="38" fill="#FFFFFF" font-size="12" font-weight="600" class="sans-txt">AWS Deploy</text>
    <text x="12" y="52" fill="#94A3B8" font-size="9.5" class="mono-txt">Docker on EC2/S3</text>
  </g>
</svg>
