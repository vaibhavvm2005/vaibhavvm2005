<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0728"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="14" fill="url(#hookBg)" stroke="#1F1352" stroke-width="1.5"/>

  <!-- Question Heading -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-1">
      You’re probably here to see what I actually <tspan fill="#E8FF54">build.</tspan>
    </text>
  </g>

  <line x1="50" y1="95" x2="850" y2="95" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Left Button / Right Description -->
  <g transform="translate(50, 140)">
    <!-- Button -->
    <rect width="250" height="52" rx="26" fill="#E8FF54"/>
    <text x="110" y="32" fill="#070414" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="1">SEE MY TRACK RECORD</text>
    <circle cx="218" cy="26" r="16" fill="#070414"/>
    <path d="M 213 31 L 223 21 M 216 21 L 223 21 L 223 28" fill="none" stroke="#E8FF54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Paragraph -->
    <text x="310" y="20" fill="#F7F5F0" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      I specialize in full-lifecycle Data Science, Machine Learning, and Edge AI systems.
    </text>
    <text x="310" y="44" fill="#9E97B8" font-family="'Inter', sans-serif" font-size="12" font-weight="400">
