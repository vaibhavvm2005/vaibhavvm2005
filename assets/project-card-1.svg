<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <!-- Preview Box Gradient -->
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="rocGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FD6D9"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
  </defs>

  <!-- Figma Selected Project Tag -->
  <text x="8" y="16" fill="#00A3FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PROJECT 01</text>

  <!-- Figma Card Container with Selection Outline -->
  <g transform="translate(8, 26)">
    <!-- White Card Background -->
    <rect width="634" height="320" rx="10" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>

    <!-- Figma Corner Handles -->
    <rect x="-4" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="630" y="-4" width="8" height="8" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="-4" y="316" width="8" height="8" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="630" y="316" width="8" height="8" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>

    <!-- Aspect 16:9 Inner Visual Preview Container -->
    <g transform="translate(16, 16)">
      <rect width="602" height="175" rx="8" fill="url(#p1Grad)"/>
      
      <!-- Visual ROC Curve & Latency Metric -->
      <g transform="translate(30, 25)">
        <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">MLOPS PREDICTIVE PIPELINE</text>
        <text x="0" y="32" fill="#0FD6D9" font-family="'Inter', sans-serif" font-size="28" font-weight="900">0.942 ROC-AUC</text>
        <text x="0" y="52" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">XGBoost Optimized Classifier</text>

        <text x="0" y="85" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">INFERENCE SERVICE</text>
        <text x="0" y="105" fill="#10B981" font-family="'Inter', sans-serif" font-size="16" font-weight="800">&lt; 14ms API Latency (FastAPI)</text>
      </g>

      <!-- Curve Graphic -->
      <g transform="translate(310, 15)">
        <line x1="0" y1="120" x2="250" y2="120" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="120" x2="0" y2="10" stroke="#334155" stroke-width="1"/>
        <line x1="0" y1="120" x2="250" y2="10" stroke="#334155" stroke-dasharray="3 3" stroke-width="0.8"/>
        <path d="M 0 120 Q 30 25, 120 18 T 250 12" fill="none" stroke="url(#rocGrad)" stroke-width="3"/>
        <text x="0" y="138" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">DATA ──► XGBOOST ──► MLFLOW ──► DOCKER ──► AWS</text>
      </g>
    </g>

    <!-- Card Text Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="18" fill="#000000" font-family="'Inter', sans-serif" font-size="18" font-weight="800" letter-spacing="-0.3">
        Customer Churn Prediction
      </text>
      <text x="0" y="38" fill="#555555" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
        End-to-end predictive intelligence pipeline and containerized inference microservice
      </text>

      <!-- Tag Pills & Link Icon -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="105" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="52" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Machine Learning</text>

        <rect x="113" y="0" width="62" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="144" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">MLflow</text>

        <rect x="183" y="0" width="62" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="214" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">FastAPI</text>

        <rect x="253" y="0" width="62" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="284" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Docker</text>

        <rect x="323" y="0" width="55" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="350" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">AWS</text>

        <!-- External Link Arrow -->
        <g transform="translate(565, 2)">
          <path d="M 0 12 L 12 0 M 3 0 L 12 0 L 12 9" fill="none" stroke="#00A3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
