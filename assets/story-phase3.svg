<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="codeGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.022)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="12" fill="#080808" stroke="#1A1A1A" stroke-width="1"/>
  <rect width="900" height="260" fill="url(#codeGrid)"/>

  <!-- Floating Code Chips (Exact Emilian Misera code background aesthetic) -->
  <g font-family="'JetBrains Mono', 'Source Code Pro', monospace" font-size="11" opacity="0.6">
    <text x="50" y="45" fill="#50FA7B">from sklearn.ensemble import <tspan fill="#F8F8F2">XGBClassifier</tspan></text>
    <text x="40" y="110" fill="#FF79C6">import <tspan fill="#8BE9FD">torch.nn</tspan> as <tspan fill="#F8F8F2">nn</tspan></text>
    <text x="60" y="180" fill="#F1FA8C">"pipeline = Pipeline(steps=[...])"</text>
    <text x="45" y="235" fill="#8BE9FD">model.fit<tspan fill="#F8F8F2">(X_train, y_train)</tspan></text>

    <text x="620" y="45" fill="#8BE9FD">app = <tspan fill="#50FA7B">FastAPI</tspan>(title="ML-API")</text>
    <text x="650" y="105" fill="#FF79C6">@app.post<tspan fill="#F1FA8C">("/predict")</tspan></text>
    <text x="600" y="175" fill="#BD93F9">mlflow.log_metric<tspan fill="#F8F8F2">("roc_auc", 0.94)</tspan></text>
    <text x="630" y="235" fill="#50FA7B">docker run <tspan fill="#F8F8F2">-p 8000:8000 ml-service</tspan></text>
  </g>

  <!-- Center Big Headline -->
  <g transform="translate(450, 120)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" text-anchor="middle">
      I started building what I design
    </text>
    <text x="0" y="45" fill="#0FD6D9" font-family="'Inter', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" text-anchor="middle">
      — and I stuck with it.
    </text>
  </g>
</svg>
