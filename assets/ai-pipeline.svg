<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="280" rx="16" fill="url(#pipeBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Pipeline Header -->
  <text x="40" y="38" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">
    // END-TO-END AI / MLOPS LIFECYCLE ARCHITECTURE
  </text>
  <text x="880" y="38" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" text-anchor="end">
    PIPELINE STATUS: VERIFIED
  </text>
  <line x1="40" y1="48" x2="880" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- ======================== ROW 1: INGESTION TO MODEL (Y = 100) ======================== -->
  
  <!-- Connector Line Row 1 -->
  <line x1="70" y1="100" x2="850" y2="100" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="100" x2="850" y2="100" stroke="url(#cyanLine)" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- NODE 1: RAW DATA -->
  <g transform="translate(110, 100)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#00F0FF" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">01. RAW DATA</text>
    <text y="12" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">SQL / APIs / Streams</text>
  </g>

  <!-- NODE 2: DATA CLEANING -->
  <g transform="translate(280, 100)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#3B82F6" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">02. CLEANING</text>
    <text y="12" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Imputation / EDA</text>
  </g>

  <!-- NODE 3: FEATURE ENGINEERING -->
  <g transform="translate(455, 100)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#0A0E1A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">03. FEATURE ENG</text>
    <text y="12" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Encoding / Scaling</text>
  </g>

  <!-- NODE 4: ML MODEL TRAINING -->
  <g transform="translate(635, 100)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#0A0E1A" stroke="#EC4899" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">04. ML TRAINING</text>
    <text y="12" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">XGBoost / Scikit</text>
  </g>

  <!-- NODE 5: MODEL EVALUATION -->
  <g transform="translate(810, 100)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#00FFA3" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">05. EVALUATION</text>
    <text y="12" fill="#00FFA3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">ROC-AUC / Metrics</text>
  </g>

  <!-- Transition Curve from Row 1 Node 5 to Row 2 Node 6 -->
  <path d="M 810 124 C 810 160, 810 170, 810 190" fill="none" stroke="#00FFA3" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ======================== ROW 2: MLOPS TO CLOUD & IMPACT (Y = 210) ======================== -->
  
  <!-- Connector Line Row 2 (Right to Left flow for circular coherence) -->
  <line x1="810" y1="210" x2="70" y2="210" stroke="#334155" stroke-width="2"/>
  <line x1="810" y1="210" x2="70" y2="210" stroke="url(#cyanLine)" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- NODE 6: MLFLOW TRACKING -->
  <g transform="translate(810, 210)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#00FFA3" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">06. MLFLOW</text>
    <text y="12" fill="#00FFA3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Experiment Tracking</text>
  </g>

  <!-- NODE 7: FASTAPI INFERENCE -->
  <g transform="translate(635, 210)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#0A0E1A" stroke="#00F0FF" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">07. FASTAPI REST</text>
    <text y="12" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Low-Latency Serving</text>
  </g>

  <!-- NODE 8: DOCKER CONTAINER -->
  <g transform="translate(455, 210)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#0A0E1A" stroke="#3B82F6" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">08. DOCKER</text>
    <text y="12" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Reproducible Image</text>
  </g>

  <!-- NODE 9: AWS CLOUD -->
  <g transform="translate(280, 210)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">09. AWS CLOUD</text>
    <text y="12" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">Scalable Deploy</text>
  </g>

  <!-- NODE 10: REAL IMPACT -->
  <g transform="translate(110, 210)">
    <rect x="-65" y="-24" width="130" height="48" rx="8" fill="#0A0E1A" stroke="#00FFA3" stroke-width="2" filter="url(#glow)"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">10. PRODUCTION</text>
    <text y="12" fill="#00FFA3" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">Real-World Impact</text>
  </g>
</svg>
