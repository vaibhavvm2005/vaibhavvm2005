<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="canvasDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <!-- Emilian Signature Fluid Gradient -->
    <linearGradient id="emilianGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FD6D9"/>
      <stop offset="25%" stop-color="#43E5D8"/>
      <stop offset="50%" stop-color="#7CF1D4"/>
      <stop offset="75%" stop-color="#6BE7E9"/>
      <stop offset="100%" stop-color="#4DB8FF"/>
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Animations -->
    <style>
      .cursor-float1 { animation: floatC1 6s ease-in-out infinite alternate; }
      .cursor-float2 { animation: floatC2 7s ease-in-out infinite alternate; }
      .cursor-float3 { animation: floatC3 5.5s ease-in-out infinite alternate; }
      .scroll-pulse { animation: bounceScroll 2s ease-in-out infinite; }

      @keyframes floatC1 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(18px, -14px); }
      }
      @keyframes floatC2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-15px, 12px); }
      }
      @keyframes floatC3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(12px, 15px); }
      }
      @keyframes bounceScroll {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(5px); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1000" height="420" rx="16" fill="url(#canvasDark)" stroke="#1A1A1A" stroke-width="1"/>
  <rect width="1000" height="420" fill="url(#gridPattern)"/>

  <!-- Figma Multiplayer Cursor 1 (Cyan - Vaibhav) -->
  <g class="cursor-float1" transform="translate(140, 70)">
    <path d="M 0 0 L 5 18 L 9 13 L 15 13 Z" fill="#0FD6D9" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="12" y="10" width="82" height="22" rx="11" fill="#0FD6D9"/>
    <text x="53" y="24" fill="#000000" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Vaibhav</text>
  </g>

  <!-- Figma Multiplayer Cursor 2 (Pink - Recruiter) -->
  <g class="cursor-float2" transform="translate(820, 80)">
    <path d="M 0 0 L 5 18 L 9 13 L 15 13 Z" fill="#FF30D9" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="12" y="10" width="76" height="22" rx="11" fill="#FF30D9"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Recruiter</text>
  </g>

  <!-- Figma Multiplayer Cursor 3 (Green - You) -->
  <g class="cursor-float3" transform="translate(760, 310)">
    <path d="M 0 0 L 5 18 L 9 13 L 15 13 Z" fill="#0FC97C" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="12" y="10" width="54" height="22" rx="11" fill="#0FC97C"/>
    <text x="39" y="24" fill="#000000" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">You</text>
  </g>

  <!-- Massive Hero Typography (Emilian Misera Style) -->
  <g transform="translate(500, 150)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" text-anchor="middle">
      say hello to your
    </text>

    <!-- Gradient Signature Subheading -->
    <text x="-135" y="60" fill="url(#emilianGrad)" font-family="'Telma', 'Playfair Display', Georgia, serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="1">
      creative
    </text>

    <text x="100" y="60" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="50" font-weight="800" letter-spacing="-1">
      data scientist
    </text>
  </g>

  <!-- Sub-label tag -->
  <text x="500" y="270" fill="#8D8D8D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle">
    AI / ML ENGINEER  •  DATA SYSTEMS  •  DESIGN MEETS CODE
  </text>

  <!-- Scroll Down Indicator -->
  <g class="scroll-pulse" transform="translate(500, 330)">
    <text x="0" y="0" fill="rgba(255, 255, 255, 0.6)" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="3" text-anchor="middle">
      HAVE A LOOK
    </text>
    <rect x="-8" y="10" width="16" height="24" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2"/>
    <circle cx="0" cy="18" r="2" fill="#0FD6D9"/>
  </g>
</svg>
