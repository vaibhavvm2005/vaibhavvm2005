<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <!-- Pure Black Background Gradient -->
    <linearGradient id="pureBlackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#020306" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Times New Roman Headline Gradient -->
    <linearGradient id="serifTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Ambient Atmosphere -->
    <radialGradient id="cyberAmbient" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Text Protection Shield -->
    <radialGradient id="textBackdrop" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softCyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes synapPulseAnim {
        0%, 100% { opacity: 0.15; stroke-width: 0.8; }
        50% { opacity: 0.45; stroke-width: 1.2; }
      }
      @keyframes nodeCorePulse {
        0%, 100% { r: 3.5; opacity: 0.4; }
        50% { r: 5.5; opacity: 0.9; }
      }
      @keyframes dataPacketFlow {
        0% { stroke-dashoffset: 320; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes statusDotBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes laserScanMove {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(960px); }
      }

      .synap-wire {
        animation: synapPulseAnim 5s ease-in-out infinite;
      }
      .node-spark {
        animation: nodeCorePulse 4s ease-in-out infinite;
      }
      .packet-stream {
        stroke-dasharray: 6 90;
        animation: dataPacketFlow 5s linear infinite;
      }
      .status-ping {
        animation: statusDotBlink 2s ease-in-out infinite;
      }
      .laser-scanner {
        animation: laserScanMove 4s ease-in-out infinite;
      }

      /* Times New Roman / Serif Typography */
      .tnr-title {
        font-family: 'Times New Roman', Times, 'Georgia', serif;
      }
      .mono-telemetry {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      }
      .pill-badge {
        fill: #04070D;
        stroke: #161F2E;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Canvas Background (Pure Black) -->
  <rect width="960" height="300" rx="14" fill="url(#pureBlackBg)" stroke="#161F2E" stroke-width="1.2" />
  <rect width="960" height="300" rx="14" fill="url(#cyberAmbient)" />

  <!-- Technical Coordinate Crosshairs (+) -->
  <g stroke="#00F0FF" stroke-opacity="0.08" stroke-width="0.75">
    <path d="M 120 45 L 126 45 M 123 42 L 123 48" />
    <path d="M 480 35 L 486 35 M 483 32 L 483 38" />
    <path d="M 890 50 L 896 50 M 893 47 L 893 53" />
    <path d="M 920 220 L 926 220 M 923 217 L 923 223" />
    <path d="M 680 270 L 686 270 M 683 267 L 683 273" />
  </g>

  <!-- ==================== CYBER-TECH CIRCUIT TOPOLOGY ==================== -->
  <g fill="none">
    <!-- Synaptic Wire Pathways -->
    <line x1="680" y1="90" x2="770" y2="60" stroke="#00F0FF" class="synap-wire" />
    <line x1="770" y1="60" x2="870" y2="85" stroke="#00F0FF" class="synap-wire" />
    <line x1="770" y1="60" x2="800" y2="150" stroke="#38BDF8" class="synap-wire" />
    <line x1="680" y1="90" x2="720" y2="180" stroke="#00F0FF" class="synap-wire" />
    <line x1="720" y1="180" x2="800" y2="150" stroke="#00F0FF" class="synap-wire" />
    <line x1="800" y1="150" x2="890" y2="160" stroke="#00F0FF" class="synap-wire" />
    <line x1="870" y1="85" x2="890" y2="160" stroke="#38BDF8" class="synap-wire" />
    <line x1="800" y1="150" x2="830" y2="235" stroke="#00F0FF" class="synap-wire" />
    <line x1="720" y1="180" x2="770" y2="250" stroke="#38BDF8" class="synap-wire" />
    <line x1="770" y1="250" x2="830" y2="235" stroke="#00F0FF" class="synap-wire" />
    <line x1="830" y1="235" x2="910" y2="245" stroke="#00F0FF" class="synap-wire" />
    <line x1="890" y1="160" x2="910" y2="245" stroke="#38BDF8" class="synap-wire" />

    <!-- Animated Data Pulses -->
    <path d="M 680 90 L 770 60 L 870 85 L 890 160 L 830 235 L 910 245" 
          stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" class="packet-stream" filter="url(#softCyanGlow)" />
    
    <path d="M 720 180 L 800 150 L 870 85" 
          stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" class="packet-stream" />

    <!-- Nodes Junctions -->
    <g fill="#000000" stroke="#00F0FF" stroke-width="1.4">
      <circle cx="680" cy="90" r="4" />
      <circle cx="770" cy="60" r="4.5" stroke="#FFFFFF" />
      <circle cx="870" cy="85" r="4" />
      <circle cx="720" cy="180" r="4" />
      <circle cx="800" cy="150" r="5" stroke="#FFFFFF" />
      <circle cx="890" cy="160" r="4.5" />
      <circle cx="770" cy="250" r="4" />
      <circle cx="830" cy="235" r="5" stroke="#FFFFFF" />
      <circle cx="910" cy="245" r="4" />
    </g>

    <!-- Node Glow Sparks -->
    <circle cx="770" cy="60" r="3.5" fill="#00F0FF" class="node-spark" filter="url(#softCyanGlow)" />
    <circle cx="800" cy="150" r="4" fill="#00F0FF" class="node-spark" filter="url(#softCyanGlow)" />
    <circle cx="830" cy="235" r="3.5" fill="#38BDF8" class="node-spark" filter="url(#softCyanGlow)" />

    <!-- Node Centers -->
    <circle cx="770" cy="60" r="1.5" fill="#FFFFFF" />
    <circle cx="800" cy="150" r="2" fill="#FFFFFF" />
    <circle cx="830" cy="235" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- ==================== FROSTED TEXT SHIELD ==================== -->
  <rect x="0" y="0" width="620" height="300" rx="14" fill="url(#textBackdrop)" />

  <!-- Corner Cyber Markers -->
  <path d="M 14 32 L 14 14 L 32 14" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 946 32 L 946 14 L 928 14" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 14 268 L 14 286 L 32 286" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.6" />
  <path d="M 946 268 L 946 286 L 928 286" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- ==================== TOP TELEMETRY HUD BAR WITH GITHUB ICON ==================== -->
  <g transform="translate(48, 38)">
    <circle cx="5" cy="5" r="3.5" fill="#00F0FF" class="status-ping" filter="url(#softCyanGlow)" />
    <circle cx="5" cy="5" r="1.5" fill="#FFFFFF" />
    
    <text x="18" y="9" fill="#00F0FF" font-size="10.5" font-weight="700" letter-spacing="1.5" class="mono-telemetry">
      SYS.STATUS // ONLINE &amp; ACTIVE
    </text>

    <!-- Embedded GitHub Octocat Icon -->
    <g transform="translate(290, -3) scale(0.7)">
      <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#94A3B8" />
    </g>
    <text x="312" y="9" fill="#94A3B8" font-size="10.5" font-weight="500" letter-spacing="0.8" class="mono-telemetry">
      GITHUB: @vaibhavvm2005
    </text>

    <text x="640" y="9" fill="#475569" font-size="10.5" font-weight="500" letter-spacing="0.5" class="mono-telemetry">
      VTU CSE (DATA SCIENCE)
    </text>
  </g>

  <!-- ==================== MAIN HERO IDENTITY TYPOGRAPHY (TIMES NEW ROMAN) ==================== -->
  <g transform="translate(48, 92)">
    <!-- Primary Name Headline in Times New Roman -->
    <text x="0" y="46" fill="url(#serifTitleGrad)" font-size="46" font-weight="700" letter-spacing="0.5" class="tnr-title">
      Vaibhav Madival
    </text>

    <!-- Role Sub-Headline in Times New Roman + Cyan Accent -->
    <text x="0" y="78" fill="url(#cyanAccent)" font-size="16" font-weight="600" letter-spacing="1" class="tnr-title">
      Data Science Engineer | AI / ML | Full Stack Developer
    </text>

    <!-- Professional Statement in Times New Roman -->
    <text x="0" y="110" fill="#94A3B8" font-size="14" font-weight="400" letter-spacing="0.2" class="tnr-title">
      Building intelligent, data-driven systems with machine learning, modern engineering, and scalable technologies.
    </text>

    <!-- Capsule Skill Badges -->
    <g transform="translate(0, 138)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="26" rx="5" class="pill-badge" />
      <text x="12" y="17" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Machine Learning</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="128" height="26" rx="5" class="pill-badge" />
      <text x="160" y="17" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">MLOps &amp; Cloud</text>

      <!-- Pill 3 -->
      <rect x="286" y="0" width="134" height="26" rx="5" class="pill-badge" />
      <text x="298" y="17" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Speech AI &amp; NLP</text>

      <!-- Pill 4 -->
      <rect x="430" y="0" width="168" height="26" rx="5" class="pill-badge" />
      <text x="442" y="17" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-telemetry">Full Stack &amp; FastAPI</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SCANNING LASER BEAM ==================== -->
  <line x1="0" y1="298" x2="960" y2="298" stroke="#161F2E" stroke-width="1.2" />
  <rect x="0" y="297" width="280" height="2" fill="url(#laserBeamGrad)" class="laser-scanner" />
</svg>
