<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%">
  <defs>
    <!-- RIO Royal Violet / Dark Canvas -->
    <linearGradient id="rioCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070414"/>
      <stop offset="50%" stop-color="#0E0728"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>

    <!-- RIO Glow Ambient -->
    <radialGradient id="rioGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#230F66" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#070414" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid -->
    <pattern id="rioGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="460" rx="16" fill="url(#rioCanvas)" stroke="#1F1352" stroke-width="1.5"/>
  <rect width="1000" height="460" fill="url(#rioGlow)"/>
  <rect width="1000" height="460" fill="url(#rioGrid)"/>

  <!-- Top Metadata Bar (RIO Property Style) -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" fill="#E8FF54" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">01. DATA SCIENCE</text>
    <text x="180" y="0" fill="#9E97B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">02. MACHINE LEARNING</text>
    <text x="400" y="0" fill="#9E97B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="2">03. AI ARCHITECTURE</text>

    <!-- Right Availability Tag -->
    <g transform="translate(740, -12)">
      <rect width="140" height="24" rx="12" fill="#140A38" stroke="#E8FF54" stroke-width="1"/>
      <circle cx="14" cy="12" r="3" fill="#E8FF54"/>
      <text x="24" y="16" fill="#E8FF54" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5">OPEN FOR ROLES</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="75" x2="940" y2="75" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Giant Staggered Hero Typography (Signature RIO Layout) -->
  <!-- Line 1: VAIBHAV -->
  <text x="60" y="180" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="96" font-weight="900" letter-spacing="-3" text-anchor="start">
    VAIBHAV
  </text>

  <!-- Line 2: MADIVAL + ARCHITECTS -->
  <text x="60" y="275" fill="rgba(255, 255, 255, 0.85)" font-family="'Inter', -apple-system, sans-serif" font-size="96" font-weight="900" letter-spacing="-3" text-anchor="start">
    MADIVAL
  </text>
  <text x="940" y="275" fill="#E8FF54" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" text-anchor="end">
    ARCHITECTS
  </text>

  <!-- Line 3: INTELLIGENT SYSTEMS -->
  <text x="940" y="365" fill="#B39CFF" font-family="'Inter', -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-3" text-anchor="end">
    INTELLIGENT SYSTEMS
  </text>

  <!-- Bottom Details Bar -->
  <line x1="60" y1="400" x2="940" y2="400" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <g transform="translate(60, 428)">
    <text x="0" y="0" fill="#E8FF54" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">0.942 ROC-AUC</text>
    <text x="140" y="0" fill="#9E97B8" font-family="'JetBrains Mono', monospace" font-size="11">XGBOOST CLASSIFIER</text>
    <text x="360" y="0" fill="#E8FF54" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">&lt;14MS LATENCY</text>
    <text x="490" y="0" fill="#9E97B8" font-family="'JetBrains Mono', monospace" font-size="11">FASTAPI MICROSERVICE</text>
    <text x="740" y="0" fill="#B39CFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">NVIDIA JETSON EDGE AI</text>
  </g>
</svg>
