<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Emilian Signature Fluid Gradient -->
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0FD6D9"/>
      <stop offset="25%" stop-color="#43E5D8"/>
      <stop offset="50%" stop-color="#7CF1D4"/>
      <stop offset="75%" stop-color="#6BE7E9"/>
      <stop offset="100%" stop-color="#4DB8FF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" rx="16" fill="#080808" stroke="#1F1F1F" stroke-width="1"/>

  <!-- Multiplayer Cursor (Pink - Recruiter) -->
  <g transform="translate(680, 50)">
    <path d="M 0 0 L 5 18 L 9 13 L 15 13 Z" fill="#FF30D9" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="12" y="10" width="76" height="22" rx="11" fill="#FF30D9"/>
    <text x="50" y="24" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Recruiter</text>
  </g>

  <!-- Multiplayer Cursor (Cyan - Vaibhav) -->
  <g transform="translate(120, 150)">
    <path d="M 0 0 L 5 18 L 9 13 L 15 13 Z" fill="#0FD6D9" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="12" y="10" width="76" height="22" rx="11" fill="#0FD6D9"/>
    <text x="50" y="24" fill="#000000" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Vaibhav</text>
  </g>

  <!-- Main Statement -->
  <g transform="translate(450, 95)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="38" font-weight="800" letter-spacing="-1" text-anchor="middle">
      Let's <tspan fill="url(#ctaGrad)" font-family="'Telma', 'Playfair Display', Georgia, serif" font-style="italic" font-weight="900">build</tspan> something useful.
    </text>
    <text x="0" y="45" fill="#8D8D8D" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle">
      OPEN TO FULL-TIME DATA SCIENCE &amp; AI/ML ROLES
    </text>
  </g>
</svg>
