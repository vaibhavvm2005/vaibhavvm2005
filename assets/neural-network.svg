<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Digital Grid lines -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.3" stroke-dasharray="4 4">
    <line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="212" y1="0" x2="212" y2="320"/>
    <line x1="425" y1="0" x2="425" y2="320"/>
    <line x1="637" y1="0" x2="637" y2="320"/>
  </g>

  <!-- Neural Network Connections (Glowing Synapses) -->
  <!-- Center (425, 160) to Surrounding Nodes -->
  <g stroke-linecap="round">
    <!-- Center to Top (AI Core -> Cloud) -->
    <line x1="425" y1="160" x2="425" y2="60" stroke="#00F0FF" stroke-width="2" opacity="0.8" filter="url(#glowCyan)"/>
    <line x1="425" y1="160" x2="425" y2="60" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Center to Top-Left (AI Core -> Data Science) -->
    <line x1="425" y1="160" x2="160" y2="80" stroke="#3B82F6" stroke-width="2" opacity="0.8" filter="url(#glowCyan)"/>
    <line x1="425" y1="160" x2="160" y2="80" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Center to Bottom-Left (AI Core -> Machine Learning) -->
    <line x1="425" y1="160" x2="160" y2="240" stroke="#8B5CF6" stroke-width="2" opacity="0.8" filter="url(#glowPurple)"/>
    <line x1="425" y1="160" x2="160" y2="240" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Center to Top-Right (AI Core -> Deep Learning & AI) -->
    <line x1="425" y1="160" x2="690" y2="80" stroke="#EC4899" stroke-width="2" opacity="0.8" filter="url(#glowPurple)"/>
    <line x1="425" y1="160" x2="690" y2="80" stroke="#EC4899" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Center to Bottom-Right (AI Core -> Production MLOps) -->
    <line x1="425" y1="160" x2="690" y2="240" stroke="#00FFA3" stroke-width="2" opacity="0.8" filter="url(#glowCyan)"/>
    <line x1="425" y1="160" x2="690" y2="240" stroke="#00FFA3" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Inter-node Periphery Connections -->
    <line x1="160" y1="80" x2="425" y2="60" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <line x1="425" y1="60" x2="690" y2="80" stroke="#EC4899" stroke-width="1" opacity="0.4"/>
    <line x1="160" y1="80" x2="160" y2="240" stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
    <line x1="690" y1="80" x2="690" y2="240" stroke="#00FFA3" stroke-width="1" opacity="0.4"/>
    <line x1="160" y1="240" x2="690" y2="240" stroke="#3B82F6" stroke-width="0.8" opacity="0.3" stroke-dasharray="6 6"/>
  </g>

  <!-- DATA PACKETS (Small Signal Nodes along pathways) -->
  <circle cx="292" cy="120" r="3.5" fill="#00F0FF" filter="url(#glowCyan)"/>
  <circle cx="292" cy="200" r="3.5" fill="#8B5CF6" filter="url(#glowPurple)"/>
  <circle cx="557" cy="120" r="3.5" fill="#EC4899" filter="url(#glowPurple)"/>
  <circle cx="557" cy="200" r="3.5" fill="#00FFA3" filter="url(#glowCyan)"/>
  <circle cx="425" cy="110" r="3.5" fill="#00F0FF" filter="url(#glowCyan)"/>

  <!-- ======================== SATELLITE NODES ======================== -->

  <!-- NODE 1: DATA SCIENCE (Top-Left) -->
  <g transform="translate(160, 80)">
    <circle r="36" fill="#0A0E1A" stroke="#3B82F6" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">DATA</text>
    <text y="10" fill="#3B82F6" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9" font-weight="600" text-anchor="middle">SCIENCE</text>
    <circle cx="0" cy="24" r="3" fill="#3B82F6"/>
  </g>

  <!-- NODE 2: MACHINE LEARNING (Bottom-Left) -->
  <g transform="translate(160, 240)">
    <circle r="36" fill="#0A0E1A" stroke="#8B5CF6" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">MACHINE</text>
    <text y="10" fill="#8B5CF6" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9" font-weight="600" text-anchor="middle">LEARNING</text>
    <circle cx="0" cy="-24" r="3" fill="#8B5CF6"/>
  </g>

  <!-- NODE 3: CLOUD & APIS (Top-Center) -->
  <g transform="translate(425, 60)">
    <circle r="32" fill="#0A0E1A" stroke="#00F0FF" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <text y="-3" fill="#FFFFFF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">CLOUD</text>
    <text y="9" fill="#00F0FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="8.5" font-weight="600" text-anchor="middle">&amp; FASTAPI</text>
  </g>

  <!-- NODE 4: DEEP LEARNING & AI (Top-Right) -->
  <g transform="translate(690, 80)">
    <circle r="36" fill="#0A0E1A" stroke="#EC4899" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#EC4899" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">DEEP</text>
    <text y="10" fill="#EC4899" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9" font-weight="600" text-anchor="middle">LEARNING</text>
    <circle cx="0" cy="24" r="3" fill="#EC4899"/>
  </g>

  <!-- NODE 5: PRODUCTION MLOPS (Bottom-Right) -->
  <g transform="translate(690, 240)">
    <circle r="36" fill="#0A0E1A" stroke="#00FFA3" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#00FFA3" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
    <text y="-4" fill="#FFFFFF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" text-anchor="middle">PRODUCTION</text>
    <text y="10" fill="#00FFA3" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="9" font-weight="600" text-anchor="middle">MLOPS</text>
    <circle cx="0" cy="-24" r="3" fill="#00FFA3"/>
  </g>

  <!-- ======================== CENTRAL CORE NODE ======================== -->
  <g transform="translate(425, 160)">
    <!-- Outer Glow Wave Rings -->
    <circle r="68" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.25" stroke-dasharray="5 5"/>
    <circle r="58" fill="none" stroke="#7928CA" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Central Node Body -->
    <circle r="48" fill="#05070D" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glowCyan)"/>
    
    <!-- Inner Core Graphic -->
    <circle r="40" fill="#0A0E1A" stroke="#1E293B" stroke-width="1"/>
    
    <text y="-10" fill="#00F0FF" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="10" font-weight="800" letter-spacing="1.5" text-anchor="middle">AI CORE</text>
    <text y="6" fill="#FFFFFF" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5" text-anchor="middle">VAIBHAV.AI</text>
    <text y="20" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">ENGINEER</text>

    <!-- Pulse Node Point -->
    <circle cx="0" cy="-30" r="2.5" fill="#00F0FF"/>
    <circle cx="0" cy="30" r="2.5" fill="#00F0FF"/>
    <circle cx="-30" cy="0" r="2.5" fill="#00F0FF"/>
    <circle cx="30" cy="0" r="2.5" fill="#00F0FF"/>
  </g>

  <!-- Bottom Subtitle / Protocol -->
  <text x="425" y="302" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle" letter-spacing="2">
    NEURAL ARCHITECTURE PROTOCOL // DATA ──► INTELLIGENCE ──► PRODUCTION
  </text>
</svg>
