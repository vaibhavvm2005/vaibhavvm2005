<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <rect width="900" height="220" rx="12" fill="#000000" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Figma Canvas Selection Bounding Box around Title -->
  <g transform="translate(100, 45)">
    <!-- Selection Box -->
    <rect x="-30" y="-15" width="760" height="150" fill="rgba(0, 163, 255, 0.03)" stroke="#00A3FF" stroke-width="1.5"/>
    
    <!-- 4 Corner Selection Handle Squares (Iconic Figma UI) -->
    <rect x="-35" y="-20" width="10" height="10" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="725" y="-20" width="10" height="10" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="-35" y="130" width="10" height="10" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>
    <rect x="725" y="130" width="10" height="10" fill="#FFFFFF" stroke="#00A3FF" stroke-width="1.5"/>

    <!-- Selection Dimensions Pill -->
    <rect x="330" y="145" width="80" height="18" rx="4" fill="#00A3FF"/>
    <text x="370" y="157" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">760 × 150</text>

    <!-- Main Headline -->
    <text x="350" y="45" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" text-anchor="middle">
      Then I discovered Data Science
    </text>
    <text x="350" y="95" fill="rgba(255, 255, 255, 0.7)" font-family="'Inter', sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" text-anchor="middle">
      — and loved it.
    </text>
  </g>
</svg>
