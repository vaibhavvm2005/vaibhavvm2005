<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="glowHeader" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="16" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Digital Matrix Background Grid -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
    <line x1="900" y1="0" x2="900" y2="240"/>
    <line x1="1050" y1="0" x2="1050" y2="240"/>
  </g>

  <!-- Neural Connection Synapses in Header -->
  <g stroke-linecap="round" opacity="0.6">
    <line x1="200" y1="120" x2="350" y2="70" stroke="#00F0FF" stroke-width="1"/>
    <line x1="350" y1="70" x2="600" y2="120" stroke="#3B82F6" stroke-width="1"/>
    <line x1="600" y1="120" x2="850" y2="70" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="850" y1="70" x2="1000" y2="120" stroke="#EC4899" stroke-width="1"/>
    
    <line x1="200" y1="120" x2="350" y2="170" stroke="#00F0FF" stroke-width="1"/>
    <line x1="350" y1="170" x2="600" y2="120" stroke="#00FFA3" stroke-width="1"/>
    <line x1="600" y1="120" x2="850" y2="170" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="850" y1="170" x2="1000" y2="120" stroke="#EC4899" stroke-width="1"/>
  </g>

  <!-- Glowing Synapse Dots -->
  <circle cx="200" cy="120" r="3" fill="#00F0FF"/>
  <circle cx="350" cy="70" r="3" fill="#3B82F6"/>
  <circle cx="350" cy="170" r="3" fill="#00FFA3"/>
  <circle cx="850" cy="70" r="3" fill="#8B5CF6"/>
  <circle cx="850" cy="170" r="3" fill="#8B5CF6"/>
  <circle cx="1000" cy="120" r="3" fill="#EC4899"/>

  <!-- Top System Protocol Tag -->
  <text x="600" y="55" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">
    AI INTELLIGENCE LAB // COMMAND CENTER
  </text>

  <!-- Hero Main Name -->
  <text x="600" y="115" fill="url(#headerGrad)" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="2" text-anchor="middle" filter="url(#glowHeader)">
    VAIBHAV MADIVAL
  </text>

  <!-- Hero Subtitle -->
  <text x="600" y="155" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">
    DATA SCIENCE  ×  AI  ×  MACHINE LEARNING
  </text>

  <!-- System Sub-Bar -->
  <text x="600" y="195" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" letter-spacing="1.5" text-anchor="middle">
    ENGINEERING PRODUCTION-READY INTELLIGENT SYSTEMS FROM DATA
  </text>
</svg>
