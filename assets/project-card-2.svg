<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Figma Selected Project Tag -->
  <text x="8" y="16" fill="#00A3FF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PROJECT 02</text>

  <!-- Figma Card Container with Selection Outline -->
  <g transform="translate(8, 26)">
    <!-- White Card Background -->
    <rect width="634" height="320" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Aspect 16:9 Inner Visual Preview Container -->
    <g transform="translate(16, 16)">
      <rect width="602" height="175" rx="8" fill="url(#p2Grad)"/>
      
      <!-- Audio Waveform Visualization -->
      <g transform="translate(30, 25)">
        <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">SPEECH PROCESSING // WHISPER</text>
        
        <!-- Wave Bars -->
        <g transform="translate(0, 20)">
          <rect x="0" y="8" width="4" height="24" rx="2" fill="#0FD6D9"/>
          <rect x="8" y="0" width="4" height="40" rx="2" fill="#00A3FF"/>
          <rect x="16" y="12" width="4" height="16" rx="2" fill="#0FD6D9"/>
          <rect x="24" y="4" width="4" height="32" rx="2" fill="#00A3FF"/>
          <rect x="32" y="10" width="4" height="20" rx="2" fill="#0FD6D9"/>
          <rect x="40" y="2" width="4" height="36" rx="2" fill="#00A3FF"/>
          <rect x="48" y="14" width="4" height="12" rx="2" fill="#0FD6D9"/>
          <rect x="56" y="6" width="4" height="28" rx="2" fill="#00A3FF"/>
          <rect x="64" y="0" width="4" height="40" rx="2" fill="#0FD6D9"/>
          <rect x="72" y="10" width="4" height="20" rx="2" fill="#00A3FF"/>
        </g>
        
        <text x="0" y="88" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">✓ Presidio PII Masking: Active</text>
        <text x="0" y="108" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">Sentiment &amp; Reflection Analysis</text>
      </g>

      <!-- PII Transformation Preview -->
      <g transform="translate(260, 25)">
        <rect x="0" y="0" width="310" height="40" rx="6" fill="#0A0E17" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="9">RAW: "I'm Jane Doe from California..."</text>
        
        <text x="120" y="60" fill="#0FD6D9" font-family="'Inter', sans-serif" font-size="10" font-weight="700">↓ PII SANITIZED</text>
        
        <rect x="0" y="70" width="310" height="40" rx="6" fill="#0A0E17" stroke="#10B981" stroke-width="1"/>
        <text x="12" y="94" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">OUT: "I'm &lt;NAME&gt; from &lt;LOCATION&gt;..."</text>
      </g>
    </g>

    <!-- Card Text Details -->
    <g transform="translate(20, 215)">
      <text x="0" y="18" fill="#000000" font-family="'Inter', sans-serif" font-size="18" font-weight="800" letter-spacing="-0.3">
        Mental Health AI Assistant
      </text>
      <text x="0" y="38" fill="#555555" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
        Privacy-first conversational reflection companion with real-time vocal transcription &amp; PII sanitization
      </text>

      <!-- Tag Pills & Link Icon -->
      <g transform="translate(0, 56)">
