        <text x="52" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">OpenAI Whisper</text>

        <rect x="113" y="0" width="105" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="165" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Microsoft Presidio</text>

        <rect x="226" y="0" width="70" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="261" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Streamlit</text>

        <rect x="304" y="0" width="60" height="24" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="334" y="16" fill="#334155" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Python</text>

        <!-- External Link Arrow -->
        <g transform="translate(565, 2)">
          <path d="M 0 12 L 12 0 M 3 0 L 12 0 L 12 9" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
